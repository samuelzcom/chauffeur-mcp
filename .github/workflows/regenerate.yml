name: Regenerate public mirror

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config.json'
      - '.github/workflows/regenerate.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-public-mirror
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline tests
        run: node --test tests/*.test.mjs
      - name: Generate from public sources
        run: node scripts/generate.mjs
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Commit changed outputs
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- README.md server.json mcp.json LICENSE
            git commit -m 'chore: regenerate from Business-OS'
            git push
          else
            echo 'no changes'
          fi
